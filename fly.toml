app = 'fs-blogs-cinder-forest-1489'
primary_region = 'syd'

[build]

[env]
  PORT = "3000"

[deploy]
  strategy = "canary"
  
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
