name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test, build, e2e
    runs-on: ubuntu-latest

    env:
      PORT: 3001
      TEST_MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
      SECRET: ${{ secrets.TEST_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit and API tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter bloglist-frontend exec playwright install --with-deps chromium

      - name: Start backend for e2e
        run: NODE_ENV=test PORT=3001 pnpm --filter blogs exec node index.js &

      - name: Start frontend for e2e
        run: pnpm --filter bloglist-frontend dev -- --host 127.0.0.1 &

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            curl -fsS http://localhost:5173 && exit 0
            sleep 2
          done
          exit 1

      - name: E2E tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: bloglist-frontend/playwright-report/
          retention-days: 30

  deploy:
    name: Deploy to Fly
    needs: checks
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        !contains(join(github.event.commits.*.message, ' '), '#skip')
      }}

    concurrency:
      group: fly-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  tag_release:
    name: Tag release
    needs: deploy
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        !contains(join(github.event.commits.*.message, ' '), '#skip')
      }}

    steps:
      - uses: actions/checkout@v4

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
